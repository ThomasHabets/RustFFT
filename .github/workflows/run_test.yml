on: [pull_request]

name: CI

jobs:
  check:
    name: Check+Test default features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
          - 1.86
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo check
        run: cargo check

      - name: Run cargo test
        run: cargo test

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Print rustfmt version
        run: cargo fmt -- --version

      - name: Run cargo fmt
        run: cargo fmt -- --check

  autogeneration:
    name: Check Autogenerated Code Match
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Check SSE Prime Butterflies
        run: cargo run --manifest-path ./tools/gen_simd_butterflies/Cargo.toml -- sse 7 11 13 17 19 23 29 31 --check src/sse/sse_prime_butterflies.rs
      - name: Check NEON Prime Butterflies
        run: cargo run --manifest-path ./tools/gen_simd_butterflies/Cargo.toml -- neon 7 11 13 17 19 23 29 31 --check src/neon/neon_prime_butterflies.rs
      - name: Check FCMA Prime Butterflies
        run: cargo run --manifest-path ./tools/gen_simd_butterflies/Cargo.toml -- fcma 7 11 13 17 19 23 29 31 --check src/fcma/fcma_prime_butterflies.rs
      - name: Check Wasm SIMD Prime Butterflies
        run: cargo run --manifest-path ./tools/gen_simd_butterflies/Cargo.toml -- wasm_simd 7 11 13 17 19 23 29 31 --check src/wasm_simd/wasm_simd_prime_butterflies.rs

  check_no_features:
    name: Check+Test no features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
          - 1.86
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo check
        run: cargo check --no-default-features

      - name: Run cargo test
        run: cargo test --no-default-features

  check_arm64_neon:
    name: Check and test Linux arm 64bit with neon
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
          - 1.86
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: aarch64-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Run cargo check
        run: cross check --features neon --target aarch64-unknown-linux-gnu

      - name: Run cargo test for arm
        run: cross test --release --features neon --target aarch64-unknown-linux-gnu

  # Both fcma jobs run on native arm hardware that implements ARMv8.3-A, so they really execute
  # the FCMA instructions. The tests assert that the feature was detected, so they fail rather
  # than quietly skipping if that ever stops being true.
  #
  # It is worth having both: fcma is in the default target features on aarch64-apple-darwin but
  # not on aarch64-unknown-linux-gnu, and the two targets detect it in different ways.
  check_arm64_fcma:
    name: Check and test Linux arm 64bit with fcma
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      # The FCMA intrinsics are unstable, so this feature only builds on nightly.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Run cargo check
        run: cargo check --features fcma

      - name: Run cargo test
        run: cargo test --release --features fcma

  check_macos_fcma:
    name: Check and test macOS arm 64bit with fcma
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      # The FCMA intrinsics are unstable, so this feature only builds on nightly.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Run cargo check
        run: cargo check --features fcma

      - name: Run cargo test
        run: cargo test --release --features fcma

  check_x86:
    name: Check and test Linux x86 32bit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i586-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Run cargo check
        run: cross check --target i586-unknown-linux-gnu

      - name: Run cargo test for i586
        run: cross test --target i586-unknown-linux-gnu

  check_wasm32:
    name: Check and test WebAssembly with SIMD
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
          - 1.86
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Run test suites with wasm-pack
        run: wasm-pack test --node --features wasm_simd

  check_riscv64_rvv:
    name: RVV correctness (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: VLEN128
            cpu: rv64,v=true,vlen=128,elen=64,vext_spec=v1.0
            expect: available
          - name: VLEN256
            cpu: rv64,v=true,vlen=256,elen=64,vext_spec=v1.0
            expect: available
          - name: VLEN512
            cpu: rv64,v=true,vlen=512,elen=64,vext_spec=v1.0
            expect: available
          - name: scalar-fallback
            cpu: rv64,v=false
            expect: unavailable
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64 -L /usr/riscv64-linux-gnu
      QEMU_CPU: ${{ matrix.cpu }}
      RUSTFFT_RVV_TEST_EXPECT: ${{ matrix.expect }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3
      - name: Install nightly with RISC-V target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64gc-unknown-linux-gnu
      - name: Install emulator and linker
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user
      - name: Test RVV and baseline scalar fallback
        run: cargo test --release --target riscv64gc-unknown-linux-gnu --no-default-features --features rvv
      - name: Compile RVV benchmarks
        if: matrix.name == 'VLEN256'
        run: cargo bench --no-run --target riscv64gc-unknown-linux-gnu --no-default-features --features rvv --bench bench_rustfft_rvv --bench bench_compare_scalar_rvv

  check_rvv_portability:
    name: RVV feature on non-RISC-V
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check portable planner and benchmark API
        run: cargo check --features rvv --tests --bench bench_rustfft_rvv --bench bench_compare_scalar_rvv
      - name: Test unavailable planner stub
        run: cargo test --features rvv --test rvv
